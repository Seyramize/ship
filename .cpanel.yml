---
# cPanel Application Manager configuration for Next.js static export
# This configuration will build and export your Next.js app as static files
# and copy them to the public_html directory for serving.

version: 1

deployment:
  tasks:
    - export: pnpm install --frozen-lockfile
    - export: pnpm build
    - export: pnpm export
    - export: rm -rf ../public_html/*
    - export: cp -r out/* ../public_html/
